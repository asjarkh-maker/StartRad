<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180">
<style>
.l{stroke:#5b3a3a;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.bob{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.tilt{animation:tilt 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 90%}
.h{animation:up 2.8s ease-in infinite;transform-box:fill-box;transform-origin:center;opacity:0}
.h2{animation-delay:1.4s}
.tail{animation:wag 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 100%}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes tilt{0%,100%{transform:rotate(0)}50%{transform:rotate(6deg)}}
@keyframes up{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translateY(-60px) scale(1.1)}}
@keyframes wag{50%{transform:rotate(-14deg)}}
</style>
<ellipse cx="120" cy="168" rx="92" ry="8" fill="#000" opacity=".06"/>
