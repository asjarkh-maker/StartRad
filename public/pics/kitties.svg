 <path class="l" d="M60 86 q5 -6 10 0 M80 86 q5 -6 10 0" fill="none"/>
 <path class="l" d="M71 96 q3 3 6 0" fill="none"/>
 <circle cx="56" cy="96" r="6" fill="#ff8fa3" opacity=".6"/><circle cx="94" cy="96" r="6" fill="#ff8fa3" opacity=".6"/>
 <path class="l" d="M98 128 q14 -4 22 -14" fill="none" stroke-width="10" stroke="#f7b267"/>
 <path class="l" d="M98 128 q14 -4 22 -14" fill="none"/>
 <path d="M128 100 c-6 -10 -20 -4 -14 6 l14 14 l14 -14 c6 -10 -8 -16 -14 -6z" fill="#ff4d6d" class="l"/>
</g>
<g class="tilt">
