 <path class="l" d="M146 70 l4 -24 l18 14 z M194 70 l-4 -24 l-18 14 z" fill="#fff"/>
 <path d="M150 64 l2 -10 l8 7 z M190 64 l-2 -10 l-8 7 z" fill="#ffd0c8"/>
 <circle class="l" cx="170" cy="90" r="30" fill="#fff"/>
 <circle cx="159" cy="90" r="3.6" fill="#5b3a3a"/><circle cx="181" cy="90" r="3.6" fill="#5b3a3a"/>
 <circle cx="160.2" cy="88.8" r="1.2" fill="#fff"/><circle cx="182.2" cy="88.8" r="1.2" fill="#fff"/>
 <path class="l" d="M166 100 q4 4 8 0" fill="none"/>
 <circle cx="152" cy="100" r="6" fill="#ff8fa3" opacity=".75"/><circle cx="188" cy="100" r="6" fill="#ff8fa3" opacity=".75"/>
 <path class="l" d="M150 128 q-4 -10 6 -14 M190 128 q4 -10 -6 -14" fill="none"/>
</g>
<path class="h" d="M120 70 c-4 -7 -14 -3 -10 4 l10 10 l10 -10 c4 -7 -6 -11 -10 -4z" fill="#ff758f"/>
<path class="h h2" d="M140 60 c-3 -5 -10 -2 -7 3 l7 7 l7 -7 c3 -5 -4 -8 -7 -3z" fill="#ffb3c1"/>
</svg>
