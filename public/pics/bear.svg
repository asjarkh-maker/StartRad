<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180">
<style>
.l{stroke:#4a3226;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.beat{animation:beat 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sp{animation:tw 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.s2{animation-delay:.7s}.s3{animation-delay:1.3s}
.blink{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.12)}30%{transform:scale(.97)}45%{transform:scale(1.08)}}
@keyframes tw{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1.1)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
</style>
<ellipse cx="120" cy="170" rx="70" ry="7" fill="#000" opacity=".06"/>
<g class="sway">
 <ellipse class="l" cx="120" cy="138" rx="44" ry="34" fill="#b9805a"/>
 <circle class="l" cx="86" cy="42" r="15" fill="#b9805a"/><circle cx="86" cy="42" r="7" fill="#e6b99a"/>
 <circle class="l" cx="154" cy="42" r="15" fill="#b9805a"/><circle cx="154" cy="42" r="7" fill="#e6b99a"/>
 <circle class="l" cx="120" cy="76" r="40" fill="#b9805a"/>
 <ellipse class="l" cx="120" cy="90" rx="17" ry="13" fill="#ecc8ad"/>
 <ellipse cx="120" cy="84" rx="6" ry="4.5" fill="#4a3226"/>
 <path class="l" d="M114 94 q6 5 12 0" fill="none"/>
 <g class="blink"><circle cx="103" cy="72" r="4.2" fill="#4a3226"/><circle cx="137" cy="72" r="4.2" fill="#4a3226"/></g>
 <circle cx="96" cy="90" r="6.5" fill="#ff8fa3" opacity=".55"/><circle cx="144" cy="90" r="6.5" fill="#ff8fa3" opacity=".55"/>
 <g class="beat"><path class="l" d="M120 126 c-10 -18 -38 -8 -26 12 l26 24 l26 -24 c12 -20 -16 -30 -26 -12z" fill="#ff4d6d"/>
 <path d="M100 128 q2 -8 10 -8" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" opacity=".7"/></g>
 <ellipse class="l" cx="92" cy="140" rx="11" ry="9" fill="#b9805a"/><ellipse class="l" cx="148" cy="140" rx="11" ry="9" fill="#b9805a"/>
</g>
<path class="sp" d="M40 60 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3z" fill="#ffd166"/>
<path class="sp s2" d="M196 40 l2.5 6 l6 2.5 l-6 2.5 l-2.5 6 l-2.5 -6 l-6 -2.5 l6 -2.5z" fill="#ffb3c1"/>
<path class="sp s3" d="M204 110 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2z" fill="#ffd166"/>
</svg>
