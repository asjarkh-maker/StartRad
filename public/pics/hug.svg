<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180">
<style>
.l{stroke:#6b2d3c;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.a{animation:a 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:100% 100%}
.b{animation:b 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 100%}
.m{animation:m 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center;opacity:0}
@keyframes a{0%,100%{transform:translateX(-6px) rotate(-4deg)}50%{transform:translateX(2px) rotate(4deg)}}
@keyframes b{0%,100%{transform:translateX(6px) rotate(4deg)}50%{transform:translateX(-2px) rotate(-4deg)}}
@keyframes m{0%,30%{opacity:0;transform:translateY(6px) scale(.5)}55%{opacity:1;transform:translateY(-6px) scale(1)}90%,100%{opacity:0;transform:translateY(-22px) scale(1.1)}}
</style>
