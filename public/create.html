<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/app.css">
<title>Создать приглашение — Только да</title>
</head>
<body>
<div class="ed">
  <header class="ed-top">
    <a class="logo" href="/"><span class="logo-mark"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.8 8.3 2.9 4.5 6.6 4.5c2.1 0 3.6 1.2 4.4 2.5.8-1.3 2.3-2.5 4.4-2.5 3.7 0 5.8 3.8 4.2 7.3C19.5 16.4 12 21 12 21z"/></svg></span><span>только <span class="accent">да</span></span></a>
    <nav class="dots" id="dots" aria-label="Шаги"></nav>
    <button class="btn btn-ghost btn-sm" id="reset" type="button">Начать заново</button>
  </header>
  <main class="ed-main">
    <aside class="ed-preview">
      <button class="ed-close" id="closePreview" type="button" aria-label="Закрыть превью">×</button>
      <p class="ed-hint">Нажимайте в превью — так увидит получатель</p>
      <div class="pv-phone"><div class="pv-notch"></div><div class="pv-screen" id="phone"></div></div>
      <div class="ed-tools">
        <button class="btn btn-light btn-sm" id="replay" type="button">↺ Этот экран</button>
        <button class="btn btn-light btn-sm" id="playall" type="button">▶ Пройти целиком</button>
      </div>
    </aside>
    <section class="ed-panel" id="panel"></section>
  </main>
  <footer class="ed-nav"><div class="ed-nav-in">
    <button class="btn btn-light" id="back" type="button">←<span class="hide-sm">&nbsp;Назад</span></button>
    <span class="ed-nav-mid" id="stepname"></span>
    <button class="btn btn-light ed-fab" id="fab" type="button">👀 Превью</button>
    <button class="btn" id="next" type="button">Дальше</button>
  </div></footer>
</div>
<script src="/js/tg.js"></script>
<script src="/vendor/lottie_light.min.js"></script>
<script src="/js/player.js"></script>
<script src="/js/editor.js"></script>
</body>
</html>
