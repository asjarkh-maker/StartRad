<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<meta property="og:title" content="Тебе письмо 💌"><meta property="og:description" content="Открой конверт">
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/app.css">
<title>Тебе письмо 💌</title>
</head>
<body>
<div id="root"></div>
<script src="/vendor/lottie_light.min.js"></script>
<script src="/js/player.js"></script>
<script>
(function () {
  var slug = location.pathname.split('/').pop();
  var root = document.getElementById('root');
  function msg(emoji, text, sub) {
    root.className = 'inv-msg';
    root.innerHTML = '';
    var box = document.createElement('div');
    var a = document.createElement('div'); a.className = 'big'; a.textContent = emoji;
    var b = document.createElement('h1'); b.textContent = text;
    box.append(a, b);
    if (sub) { var c = document.createElement('p'); c.textContent = sub; box.append(c); }
    root.append(box);
  }
  // события отправляем строго по очереди: иначе «готово» может обогнать выбранную дату
  var queue = Promise.resolve();
  function send(type, data) {
    var body = JSON.stringify({ type: type, data: data || {} });
    queue = queue.then(function () {
      return fetch('/api/i/' + slug + '/event', { method: 'POST', headers: { 'content-type': 'application/json' }, body: body, keepalive: true }).catch(function () {});
    });
  }
  fetch('/api/i/' + encodeURIComponent(slug)).then(function (r) {
    return r.json().then(function (d) { return { ok: r.ok, status: r.status, d: d }; });
  }).then(function (res) {
    if (!res.ok) return res.status === 410 ? msg('⏳', 'Срок действия приглашения истёк', 'Попросите отправителя создать новое') : msg('✉️', res.status === 404 ? 'Приглашение не найдено' : 'Приглашение пока недоступно');
    if (res.d.answered) return res.d.declined ? msg('😊', 'Ответ уже отправлен', 'Спасибо за честность') : msg('💖', 'Ответ уже отправлен', 'Осталось дождаться встречи 😊');
    document.title = 'Тебе письмо 💌';
    var seen = false;
    try { seen = sessionStorage.getItem('opened:' + slug) === '1'; } catch (e) {}
    Player.mount(root, res.d.config, { mode: 'live', onEvent: function (type, data) {
      if (type === 'open') { if (seen) return; seen = true; try { sessionStorage.setItem('opened:' + slug, '1'); } catch (e) {} }
      send(type, data);
    } });
  }).catch(function () { msg('📡', 'Не удалось загрузить', 'Проверьте интернет и обновите страницу'); });
})();
</script>
</body>
</html>
