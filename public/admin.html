<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Админка — Только да</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/app.css">
<style>
  .adm { max-width: 720px; margin: 0 auto; padding: 10px 24px 80px; }
  .adm h1 { font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 32px; letter-spacing: -.03em; margin: 10px 0 18px; }
  .adm .card { margin-bottom: 16px; }
  .adm h2 { font-family: 'Unbounded', sans-serif; font-size: 18px; margin: 0 0 16px; }
  .st-line { display: flex; gap: 8px; align-items: center; font-weight: 700; margin: -6px 0 16px; }
  .dot-ok, .dot-no { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .dot-ok { background: #14b87a; } .dot-no { background: #e7a400; }
  .ok-msg { color: #12663f; font-weight: 700; min-height: 1.4em; margin-top: 10px; }
  .bar { position: sticky; bottom: 0; background: var(--bg); padding: 14px 0; display: flex; gap: 12px; align-items: center; }
  select.inp { appearance: auto; }
  .chk { display: flex; gap: 10px; align-items: center; font-weight: 600; }
  .chk input { width: 20px; height: 20px; }
  code { background: #fff1f5; padding: 2px 6px; border-radius: 6px; }
  [hidden] { display: none !important; }
  .pw { position: relative; }
  .pw .inp { padding-right: 104px; }
  .pw .eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: #fff1f5; color: var(--pink); font: 700 13px 'Manrope', sans-serif; border-radius: 10px; padding: 8px 12px; cursor: pointer; }

  /* вкладки */
  .tabs-adm { display: flex; gap: 8px; margin: 0 0 20px; }
  .tabs-adm button { border: 1.5px solid var(--line); background: #fff; border-radius: 999px; padding: 10px 18px; font: 700 15px 'Manrope', sans-serif; cursor: pointer; color: var(--ink); }
  .tabs-adm button.on { background: var(--ink); border-color: var(--ink); color: #fff; }
  /* статистика */
  .viz-root { --surface-1: #fcfcfb; --text-primary: #0b0b0b; --text-secondary: #52514e; --grid: #e9e7e3; --series-1: #2a78d6; --series-2: #eb6834; }
  .periods { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .periods button { border: 1.5px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 12px; font: 600 14px 'Manrope', sans-serif; cursor: pointer; color: var(--ink); }
  .periods button.on { border-color: var(--pink); background: #fff1f5; }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
  .tile { background: #fff; border-radius: 16px; padding: 14px 16px; box-shadow: 0 14px 30px -26px rgba(36, 20, 25, .5); }
  .tile b { display: block; font-family: 'Unbounded', sans-serif; font-size: 24px; letter-spacing: -.02em; color: var(--ink); }
  .tile span { color: var(--muted); font-size: 13px; }
  .chart-card { background: var(--surface-1); border-radius: 18px; padding: 18px; margin-bottom: 16px; box-shadow: 0 14px 30px -26px rgba(36, 20, 25, .5); position: relative; }
  .chart-card h3, .lists h3, .card h3 { font-family: 'Unbounded', sans-serif; font-size: 16px; margin: 0 0 4px; color: var(--ink); }
  .legend { display: flex; gap: 16px; font-size: 13px; color: var(--text-secondary); margin: 6px 0 10px; }
  .legend span { display: inline-flex; align-items: center; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; }
  .chart svg { width: 100%; height: 220px; display: block; overflow: visible; }
  .chart text { font: 11px 'Manrope', sans-serif; fill: var(--text-secondary); }
  .tip { position: absolute; pointer-events: none; background: #241419; color: #fff; border-radius: 10px; padding: 8px 10px; font-size: 13px; line-height: 1.5; white-space: nowrap; transform: translate(-50%, -110%); display: none; z-index: 5; }
  .tip i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; }
  .lists { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .lists .card { margin: 0; padding: 18px; }
  .rows { display: grid; gap: 6px; margin-top: 10px; font-size: 14px; }
  .rows div { display: flex; justify-content: space-between; gap: 10px; }
  .rows b { font-variant-numeric: tabular-nums; }
  table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.t th, table.t td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  table.t th { color: var(--muted); font-weight: 600; font-size: 13px; }
  details.tv summary { cursor: pointer; color: var(--text-secondary); font-size: 13px; margin-top: 10px; }
  @media (max-width: 640px) { .tiles { grid-template-columns: repeat(2, 1fr); } .lists { grid-template-columns: 1fr; } .tile b { font-size: 20px; } table.t { font-size: 13px; display: block; overflow-x: auto; white-space: nowrap; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="header">
    <a class="logo" href="/"><span class="logo-mark"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.8 8.3 2.9 4.5 6.6 4.5c2.1 0 3.6 1.2 4.4 2.5.8-1.3 2.3-2.5 4.4-2.5 3.7 0 5.8 3.8 4.2 7.3C19.5 16.4 12 21 12 21z"/></svg></span><span>только <span class="accent">да</span></span></a>
    <button class="btn btn-ghost" id="logout" type="button" hidden>Выйти</button>
  </header>
</div>
<main class="adm" id="app"><p>Загрузка…</p></main>
<script>
(function () {
  'use strict';
  var app = document.getElementById('app');
  function h(tag, attrs) {
    var el = document.createElement(tag), kids = [].slice.call(arguments, 2);
    Object.keys(attrs || {}).forEach(function (k) {
      var v = attrs[k];
      if (v == null || v === false) return;
      if (k === 'text') el.textContent = v; else if (k === 'class') el.className = v;
      else if (k === 'on') Object.keys(v).forEach(function (e) { el.addEventListener(e, v[e]); });
      else el.setAttribute(k, v === true ? '' : v);
    });
    (function add(list) { list.forEach(function (c) {
      if (Array.isArray(c)) return add(c);
      if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(String(c)));
    }); })(kids);
    return el;
  }
  function api(method, url, body) {
    return fetch(url, { method: method, headers: body ? { 'content-type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined, credentials: 'same-origin' })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { d._status = r.status; return d; }); });
  }
  function reveal(input) {
    var btn = h('button', { type: 'button', class: 'eye', 'aria-label': 'Показать', text: 'Показать' });
    btn.addEventListener('click', function () {
      var show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.textContent = show ? 'Скрыть' : 'Показать';
      btn.setAttribute('aria-label', btn.textContent);
      input.focus();
    });
    return h('div', { class: 'pw' }, input, btn);
  }
  function field(label, input, hint) {
    if (input.tagName === 'INPUT' && input.type === 'password') input = reveal(input); return h('label', { class: 'f' }, h('span', { class: 'f-l', text: label }), input, hint ? h('span', { class: 'f-h', text: hint }) : null); }
  function inp(id, value, attrs) { var a = Object.assign({ class: 'inp', id: id, value: value || '' }, attrs || {}); return h('input', a); }
  var val = function (id) { return document.getElementById(id).value.trim(); };

  function login(err) {
    document.getElementById('logout').hidden = true;
    app.innerHTML = '';
    var pass = h('input', { class: 'inp', type: 'password', id: 'pass', autocomplete: 'current-password', placeholder: 'Пароль' });
    var msg = h('div', { class: 'error', text: err || '' });
    var form = h('form', { class: 'card' }, h('h2', { text: 'Вход в админку' }), field('Пароль', pass), h('button', { class: 'btn', type: 'submit', text: 'Войти' }), msg);
    form.addEventListener('submit', function (e) {
      e.preventDefault(); msg.textContent = '';
      api('POST', '/api/admin/login', { password: pass.value }).then(function (d) { if (d.ok) load(); else msg.textContent = d.error || 'Ошибка'; });
    });
    app.append(h('h1', { text: 'Админка' }), form);
    pass.focus();
  }

  function render(d) {
    var s = d.settings, st = d.status;
    document.getElementById('logout').hidden = false;
    app.innerHTML = '';
    var ok = h('div', { class: 'ok-msg' }), err = h('div', { class: 'error' });
    var status = function (good, text) { return h('div', { class: 'st-line' }, h('span', { class: good ? 'dot-ok' : 'dot-no' }), text); };

    var tg = h('div', { class: 'card' }, h('h2', { text: 'Telegram-бот' }),
      status(Boolean(st.bot), st.bot ? 'Подключён: @' + st.bot : (s.telegram.tokenSet ? 'Токен задан, но бот не подключился — проверьте токен' : 'Не подключён')),
      field('Токен бота', inp('tg', '', { type: 'password', autocomplete: 'off', placeholder: s.telegram.tokenSet ? 'задан — оставьте пустым, чтобы не менять' : '123456789:AA…' }), 'Выдаёт @BotFather: /mybots → бот → API Token'));

    var yk = h('div', { class: 'card' }, h('h2', { text: 'Оплата — ЮKassa' }),
      status(st.payment === 'yookassa', st.payment === 'yookassa' ? 'Настоящая оплата включена' : 'Тестовый режим: ссылка выдаётся бесплатно'),
      field('shopId', inp('shop', s.yookassa.shopId, { inputmode: 'numeric', autocomplete: 'off' })),
      field('Секретный ключ', inp('key', '', { type: 'password', autocomplete: 'off', placeholder: s.yookassa.secretKeySet ? 'задан — оставьте пустым, чтобы не менять' : 'live_…' }), 'Кабинет ЮKassa → Интеграция → Ключи API'),
      h('label', { class: 'chk f' }, h('input', { type: 'checkbox', id: 'receipt', checked: s.yookassa.receipt }), 'Отправлять чеки через ЮKassa (54-ФЗ)'),
      h('p', { class: 'f-h' }, 'Адрес для уведомлений в кабинете ЮKassa: ', h('code', { text: (s.site.url || location.origin) + '/api/yookassa' }), ' (старый ', h('code', { text: '/api/yk/notify' }), ' тоже работает).'));

    var site = h('div', { class: 'card' }, h('h2', { text: 'Сайт и контакты' }),
      field('Адрес сайта', inp('url', s.site.url, { placeholder: 'https://onlyda.ru' })),
      field('Почта поддержки', inp('email', s.site.email, { type: 'email' })),
      field('Телефон', inp('phone', s.site.phone)),
      field('Telegram поддержки', inp('tgsup', s.site.telegram, { placeholder: '@имя' })),
      field('Номер счётчика Яндекс Метрики', inp('metrika', s.site.metrikaId, { inputmode: 'numeric' })),
      field('Счётчик на главной («… приглашений уже отправлено»)', inp('sentBefore', String(s.site.sentBefore || 0), { inputmode: 'numeric' })),
      h('p', { class: 'f-h', text: 'Показывается как есть, с плюсом: 3700 → «3 700+». 0 — счётчик скрыт.' }),
      field('Цена ссылки, ₽', inp('price', String(s.price), { inputmode: 'numeric' })));

    var statusSel = h('select', { class: 'inp', id: 'sstatus' }, ['', 'самозанятый', 'ИП'].map(function (o) { return h('option', { value: o, selected: s.seller.status === o, text: o || '— выберите —' }); }));
    var seller = h('div', { class: 'card' }, h('h2', { text: 'Исполнитель (для оферты)' }),
      field('Статус', statusSel), field('ФИО полностью', inp('sname', s.seller.name)), field('ИНН', inp('sinn', s.seller.inn, { inputmode: 'numeric' })),
      field('ОГРНИП (для ИП)', inp('sogrn', s.seller.ogrnip)), field('Адрес (для ИП)', inp('saddr', s.seller.address)));

    var save = h('button', { class: 'btn', type: 'button', text: 'Сохранить' });
    save.addEventListener('click', function () {
      ok.textContent = ''; err.textContent = ''; save.disabled = true; save.textContent = 'Сохраняю…';
      var body = {
        site: { url: val('url'), email: val('email'), phone: val('phone'), telegram: val('tgsup'), metrikaId: val('metrika'), sentBefore: val('sentBefore') },
        seller: { status: val('sstatus'), name: val('sname'), inn: val('sinn'), ogrnip: val('sogrn'), address: val('saddr') },
        price: val('price'),
        telegram: { token: val('tg') },
        yookassa: { shopId: val('shop'), secretKey: val('key'), receipt: document.getElementById('receipt').checked },
      };
      api('PUT', '/api/admin/settings', body).then(function (r) {
        save.disabled = false; save.textContent = 'Сохранить';
        if (r._status === 401) return login('Сессия закончилась — войдите снова');
        if (!r.ok) { err.textContent = r.error || 'Ошибка'; return; }
        render(r); var m = document.querySelector('.ok-msg'); if (m) m.textContent = 'Сохранено ✓';
      });
    });

    var pw = h('div', { class: 'card' }, h('h2', { text: 'Пароль админки' }),
      s.passwordChanged ? null : h('p', { class: 'error', text: 'Пароль ещё первоначальный — смените его.' }),
      field('Текущий пароль', inp('pcur', '', { type: 'password', autocomplete: 'current-password' })),
      field('Новый пароль (от 10 символов)', inp('pnew', '', { type: 'password', autocomplete: 'new-password' })));
    var pmsg = h('div', { class: 'ok-msg' }), perr = h('div', { class: 'error' });
    pw.append(h('button', { class: 'btn btn-ghost', type: 'button', text: 'Сменить пароль', on: { click: function () {
      pmsg.textContent = ''; perr.textContent = '';
      api('POST', '/api/admin/password', { current: val('pcur'), next: document.getElementById('pnew').value }).then(function (r) {
        if (r.ok) { pmsg.textContent = 'Пароль изменён ✓'; document.getElementById('pcur').value = ''; document.getElementById('pnew').value = ''; }
        else perr.textContent = r.error || 'Ошибка';
      });
    } } }), pmsg, perr);

    // резервные копии
    var b = s.backup || {};
    var bmsg = h('div', { class: 'ok-msg' }), berr = h('div', { class: 'error', text: b.lastError ? 'Последняя попытка: ' + b.lastError : '' });
    var when = b.lastAt ? new Date(b.lastAt).toLocaleString('ru-RU', { timeZone: 'Asia/Yekaterinburg', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }) : '';
    var kb = b.lastSize ? ' · ' + (b.lastSize / 1024 / 1024).toLocaleString('ru-RU', { maximumFractionDigits: 1 }) + ' МБ' : '';
    var bk = h('div', { class: 'card' }, h('h2', { text: 'Резервные копии' }),
      status(Boolean(b.connected), b.connected ? 'Каждый день в 4:00 по Уфе — в ваш Telegram' : (st.bot ? 'Не подключены' : 'Сначала подключите Telegram-бота')),
      h('p', { class: 'f-h', text: b.connected ? (when ? 'Последняя копия: ' + when + kb : 'Копий ещё не было — отправьте первую кнопкой ниже.') : 'Бот будет присылать архив с приглашениями, ответами и фото. Ключей и паролей в архиве нет.' }));
    var actions = h('div', { class: 'own-actions' });
    if (b.connected) {
      actions.append(
        h('button', { type: 'button', class: 'btn btn-sm', text: 'Отправить копию сейчас', on: { click: function (e) {
          var btn = e.currentTarget; btn.disabled = true; btn.textContent = 'Отправляю…'; bmsg.textContent = ''; berr.textContent = '';
          api('POST', '/api/admin/backup/now').then(function (r) {
            btn.disabled = false; btn.textContent = 'Отправить копию сейчас';
            if (r.ok) { load(); } else berr.textContent = r.error || 'Ошибка';
          });
        } } }),
        h('button', { type: 'button', class: 'btn btn-ghost btn-sm', text: 'Отключить', on: { click: function () {
          if (!confirm('Отключить ежедневные резервные копии?')) return;
          api('POST', '/api/admin/backup/off').then(function () { load(); });
        } } }));
    } else if (st.bot) {
      actions.append(h('button', { type: 'button', class: 'btn btn-sm', text: 'Подключить', on: { click: function () {
        api('POST', '/api/admin/backup/link').then(function (r) {
          if (!r.link) { berr.textContent = r.error || 'Ошибка'; return; }
          bmsg.textContent = 'Откроется бот — нажмите «Запустить». Потом вернитесь сюда и обновите страницу.';
          window.open(r.link, '_blank', 'noopener');
        });
      } } }));
    }
    bk.append(actions, bmsg, berr);

    app.append(h('h1', { text: 'Админка' }), tabsBar(), tg, yk, site, seller, bk, h('div', { class: 'bar' }, save, ok, err), pw,
      h('p', { class: 'f-h', text: 'Версия сайта: ' + (st.version || 'неизвестна') }));
  }


  // ---------- статистика ----------
  var period = 30, tab = 'stats';
  var MON = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
  function dlabel(iso) { var p = iso.split('-'); return +p[2] + ' ' + MON[+p[1] - 1]; }
  var rub = function (n) { return Math.round(n).toLocaleString('ru-RU') + ' ₽'; };
  var pct = function (x) { return (Math.round(x * 1000) / 10).toLocaleString('ru-RU') + '%'; };

  function tabsBar() {
    return h('div', { class: 'tabs-adm' },
      h('button', { type: 'button', class: tab === 'stats' ? 'on' : '', text: 'Статистика', on: { click: function () { tab = 'stats'; load(); } } }),
      h('button', { type: 'button', class: tab === 'settings' ? 'on' : '', text: 'Настройки', on: { click: function () { tab = 'settings'; load(); } } }));
  }

  // столбики по дням: «Создано» и «Оплачено», одна ось, подсказка при наведении
  function chart(days) {
    var NS = 'http://www.w3.org/2000/svg';
    var W = 700, H = 220, L = 30, R = 8, T = 10, B = 26;
    var max = Math.max(1, Math.max.apply(null, days.map(function (d) { return Math.max(d.created, d.paid); })));
    var step = max <= 5 ? 1 : max <= 10 ? 2 : Math.ceil(max / 5 / 5) * 5; var top = Math.ceil(max / step) * step;
    var y = function (v) { return T + (H - T - B) * (1 - v / top); };
    var n = days.length, slot = (W - L - R) / n, gap = Math.min(2, slot * 0.08);
    var bw = Math.max(1, Math.min(14, (slot - gap * 3) / 2));
    var svg = document.createElementNS(NS, 'svg'); svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H); svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', 'Создано и оплачено по дням');
    function el(tag, a) { var e = document.createElementNS(NS, tag); Object.keys(a).forEach(function (k) { e.setAttribute(k, a[k]); }); svg.appendChild(e); return e; }
    for (var v = 0; v <= top; v += step) {
      el('line', { x1: L, x2: W - R, y1: y(v), y2: y(v), stroke: 'var(--grid)', 'stroke-width': 1 });
      var t = el('text', { x: L - 6, y: y(v) + 4, 'text-anchor': 'end' }); t.textContent = v;
    }
    // столбик со скруглённым верхом, прижатый к оси
    function bar(x, v, color) {
      if (!v) return;
      var y0 = y(0), y1 = y(v), r = Math.min(4, bw / 2, y0 - y1);
      el('path', { fill: color, d: 'M' + x + ',' + y0 + 'V' + (y1 + r) + 'Q' + x + ',' + y1 + ' ' + (x + r) + ',' + y1 + 'H' + (x + bw - r) + 'Q' + (x + bw) + ',' + y1 + ' ' + (x + bw) + ',' + (y1 + r) + 'V' + y0 + 'Z' });
    }
    var every = Math.ceil(n / 8);
    days.forEach(function (d, i) {
      var x0 = L + i * slot + (slot - (bw * 2 + gap)) / 2;
      bar(x0, d.created, 'var(--series-1)'); bar(x0 + bw + gap, d.paid, 'var(--series-2)');
      if (i % every === 0 || (i === n - 1 && (n - 1) % every >= every * 0.7)) { var t = el('text', { x: L + i * slot + slot / 2, y: H - 8, 'text-anchor': 'middle' }); t.textContent = dlabel(d.date); }
      var hit = el('rect', { x: L + i * slot, y: T, width: slot, height: H - T - B, fill: 'transparent' });
      hit.setAttribute('data-i', i);
    });
    var wrap = h('div', { class: 'chart' }); wrap.appendChild(svg);
    var tip = h('div', { class: 'tip' });
    svg.addEventListener('mousemove', function (e) {
      var i = e.target.getAttribute && e.target.getAttribute('data-i'); if (i == null) { tip.style.display = 'none'; return; }
      var d = days[+i], box = wrap.getBoundingClientRect();
      tip.innerHTML = ''; tip.append(h('b', { text: dlabel(d.date) }), h('br'), h('i', { style: 'background:var(--series-1)' }), 'Создано: ' + d.created, h('br'), h('i', { style: 'background:var(--series-2)' }), 'Оплачено: ' + d.paid);
      tip.style.display = 'block'; tip.style.left = (e.clientX - box.left + 18) + 'px'; tip.style.top = (e.clientY - box.top + 34) + 'px';
    });
    svg.addEventListener('mouseleave', function () { tip.style.display = 'none'; });
    return [wrap, tip];
  }

  function renderStats(st) {
    document.getElementById('logout').hidden = false;
    app.innerHTML = '';
    var t = st.totals;
    var periods = h('div', { class: 'periods' }, [[7, '7 дней'], [30, '30 дней'], [90, '90 дней'], [0, 'Всё время']].map(function (p) {
      return h('button', { type: 'button', class: period === p[0] ? 'on' : '', text: p[1], on: { click: function () { period = p[0]; load(); } } });
    }));
    var tile = function (v, label) { return h('div', { class: 'tile' }, h('b', { text: v }), h('span', { text: label })); };
    var tiles = h('div', { class: 'tiles' },
      tile(String(t.created), 'создано приглашений'), tile(String(t.paid), 'оплачено'),
      tile(rub(t.revenue), 'выручка'), tile(pct(t.conversion), 'из созданных оплатили'),
      tile(String(t.opened), 'открыто получателями'), tile(String(t.yes), 'ответили «да»'),
      tile(String(t.declined), 'честное «нет»'), tile(t.avgNo.toLocaleString('ru-RU', { maximumFractionDigits: 1 }), 'попыток нажать «Нет» в среднем'));

    var c = chart(st.byDay);
    var table = h('table', { class: 't' }, h('tr', {}, h('th', { text: 'День' }), h('th', { text: 'Создано' }), h('th', { text: 'Оплачено' })),
      st.byDay.slice().reverse().filter(function (d) { return d.created || d.paid; }).map(function (d) {
        return h('tr', {}, h('td', { text: dlabel(d.date) }), h('td', { text: String(d.created) }), h('td', { text: String(d.paid) }));
      }));
    var chartCard = h('div', { class: 'chart-card viz-root' }, h('h3', { text: 'По дням' }),
      h('div', { class: 'legend' }, h('span', {}, h('i', { style: 'background:var(--series-1)' }), 'Создано'), h('span', {}, h('i', { style: 'background:var(--series-2)' }), 'Оплачено')),
      c[0], c[1], h('details', { class: 'tv' }, h('summary', { text: 'Показать таблицей' }), table));

    var rows = function (list, empty) {
      return list.length ? h('div', { class: 'rows' }, list.map(function (x) { return h('div', {}, h('span', { text: x[0] }), h('b', { text: String(x[1]) })); })) : h('p', { class: 'f-h', text: empty });
    };
    var lists = h('div', { class: 'lists' },
      h('div', { class: 'card' }, h('h3', { text: 'Что выбирают' }), rows(st.picks, 'Пока нет ответов с выбором')),
      h('div', { class: 'card' }, h('h3', { text: 'Кнопка «Нет»' }), rows(st.noModes, 'Пока нет приглашений')),
      h('div', { class: 'card' }, h('h3', { text: 'Откуда создают' }), rows([['Сайт', st.sources.web], ['Telegram-бот', st.sources.tg]], '')),
      h('div', { class: 'card' }, h('h3', { text: 'Когда встречаться' }), rows([['Выбрали дату', st.dates.chosen], ['«Решим в чате»', st.dates.chat]], '')));

    var STATE = { yes: 'ответили «да» 💖', no: 'честное «нет»', opened: 'открыли', sent: 'ждёт' };
    var recent = h('div', { class: 'card' }, h('h3', { text: 'Последние оплаты' }),
      st.recent.length ? h('table', { class: 't' }, h('tr', {}, h('th', { text: 'Когда' }), h('th', { text: 'Сумма' }), h('th', { text: 'Статус' }), h('th', { text: 'Откуда' }), h('th', { text: 'Кому' }), h('th', { text: 'Номер платежа в ЮKassa' })),
        st.recent.map(function (r) {
          return h('tr', {}, h('td', { text: new Date(r.at).toLocaleString('ru-RU', { timeZone: 'Asia/Yekaterinburg', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) }),
            h('td', { text: rub(r.amount) }), h('td', { text: STATE[r.state] + (r.expired ? ' · срок истёк' : '') }), h('td', { text: (r.source === 'tg' ? 'бот' : 'сайт') + (r.utm ? ' · ' + r.utm : '') }), h('td', { text: r.to || '—' }), h('td', {}, h('code', { text: r.payId || '—', style: 'font-size:12px;user-select:all' })));
        })) : h('p', { class: 'f-h', text: 'Оплат пока нет.' }),
      h('p', { class: 'f-h', text: 'Возврат: скопируйте номер платежа → кабинет ЮKassa → «Платежи» → вставьте номер в поиск → «Вернуть платёж». Там же видно почту и карту плательщика.' }));

    // блогеры: UTM-метки
    var utmName = h('input', { class: 'inp', placeholder: 'Имя блогера латиницей, например samira' });
    var utmOut = h('div', { class: 'f-h' });
    var utmMake = function () {
      var n = utmName.value.trim().toLowerCase().replace(/[^a-z0-9а-яё_.\-]+/g, '_').replace(/^_+|_+$/g, '');
      if (!n) { utmOut.textContent = ''; return; }
      var link = location.origin + '/?utm_source=' + encodeURIComponent(n);
      utmOut.textContent = ''; utmOut.append('Ссылка для блогера: ', h('code', { text: link, style: 'user-select:all' }));
    };
    utmName.addEventListener('input', utmMake);
    var utmRows = st.utm || [];
    var blog = h('div', { class: 'card' }, h('h3', { text: 'Блогеры (UTM-метки)' }),
      utmRows.length ? h('table', { class: 't' }, h('tr', {}, h('th', { text: 'Метка' }), h('th', { text: 'Переходы' }), h('th', { text: 'Создали' }), h('th', { text: 'Оплатили' }), h('th', { text: 'Выручка' }), h('th', { text: 'Конверсия' })),
        utmRows.map(function (r) {
          return h('tr', {}, h('td', {}, h('b', { text: r.label })), h('td', { text: String(r.visits) }), h('td', { text: String(r.created) }), h('td', {}, h('b', { text: String(r.paid) })), h('td', { text: rub(r.revenue) }),
            h('td', { text: r.visits ? pct(r.paid / r.visits) : '—' }));
        })) : h('p', { class: 'f-h', text: 'За этот период переходов по меткам не было.' }),
      h('p', { class: 'f-h', text: 'Дайте блогеру ссылку с меткой. Человек, перешедший по ней, «помнится» 30 дней: если он оплатит позже, оплата всё равно засчитается блогеру. Переходы считаются по одному на человека. Конверсия — оплаты от переходов.' }),
      utmName, utmOut);

    var giftQ = h('input', { class: 'inp', placeholder: 'Имя получателя, например Самира' });
    var giftOut = h('div');
    var giftFind = h('button', { class: 'btn btn-sm', type: 'button', text: 'Найти' });
    giftFind.addEventListener('click', function () {
      giftOut.textContent = 'Ищу…';
      fetch('/api/admin/unpaid?q=' + encodeURIComponent(giftQ.value.trim())).then(function (r) { return r.json(); }).then(function (d) {
        giftOut.textContent = '';
        if (!d.list || !d.list.length) { giftOut.append(h('p', { class: 'f-h', text: 'Неоплаченных приглашений с таким именем нет.' })); return; }
        d.list.forEach(function (it) {
          var b = h('button', { class: 'btn btn-sm', type: 'button', text: 'Активировать бесплатно' });
          var row = h('div', { style: 'display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0' },
            h('b', { text: it.to }), h('span', { class: 'f-h', text: new Date(it.at).toLocaleString('ru-RU', { timeZone: 'Asia/Yekaterinburg', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) }), b);
          b.addEventListener('click', function () {
            b.disabled = true;
            fetch('/api/admin/gift', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ slug: it.slug }) }).then(function (r) { return r.json(); }).then(function (g) {
              row.textContent = '';
              row.append(h('span', { text: '✅ ' + g.to + ' — ссылка: ' }), h('code', { text: g.link, style: 'user-select:all' }), h('a', { href: g.owner, target: '_blank', text: 'страница приглашения' }));
            });
          });
          giftOut.append(row);
        });
      });
    });
    var gift = h('div', { class: 'card' }, h('h3', { text: 'Бесплатная ссылка (реклама, блогеры)' }),
      h('p', { class: 'f-h', text: 'Создайте приглашение как обычно, но не оплачивайте. Найдите его здесь по имени и активируйте — в выручку не попадёт.' }),
      h('div', { style: 'display:flex;gap:10px' }, giftQ, giftFind), giftOut);
    app.append(h('h1', { text: 'Админка' }), tabsBar(), periods, tiles, chartCard, lists, blog, recent, gift,
      h('p', { class: 'f-h', text: 'Время — ' + st.tz + '. Выручка и оплаты — только настоящие платежи ЮKassa' + (t.testPaid ? '; ещё ' + t.testPaid + ' ссылок выдано в тестовом режиме.' : '.') }));
  }

  function load() {
    if (tab === 'stats') return api('GET', '/api/admin/stats?days=' + period).then(function (d) { if (d._status === 401) login(); else renderStats(d); });
    api('GET', '/api/admin/settings').then(function (d) { if (d._status === 401) login(); else render(d); });
  }
  document.getElementById('logout').addEventListener('click', function () { api('POST', '/api/admin/logout').then(function () { login(); }); });
  load();
})();
</script>
